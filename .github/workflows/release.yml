name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/Kbdking.Tests/Kbdking.Tests.csproj -c Release

      - name: Publish
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          dotnet publish src/Kbdking.App/Kbdking.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained -p:Version=$v -o dist/kbdking
          dotnet publish src/Kbdking.Cli/Kbdking.Cli.csproj -c Release -r win-x64 --self-contained -p:Version=$v -o dist/kbdking
          dotnet publish src/Kbdking.Stub/Kbdking.Stub.csproj -c Release -r win-x64 -p:Version=$v -o dist/kbdking
          # ARM64: native app and CLI. The installer stub stays x64 (it runs emulated and installs the ARM64 DLL).
          dotnet publish src/Kbdking.App/Kbdking.App.csproj -c Release -p:Platform=ARM64 -r win-arm64 --self-contained -p:Version=$v -o dist/kbdking-arm64
          dotnet publish src/Kbdking.Cli/Kbdking.Cli.csproj -c Release -r win-arm64 --self-contained -p:Version=$v -o dist/kbdking-arm64
          Copy-Item dist/kbdking/Kbdking.Stub.exe dist/kbdking-arm64/

      # Code signing through SignPath Foundation (free for open source). Runs once the project is approved
      # and the repository variables/secrets below are set. See CODE_SIGNING_POLICY.md.
      - name: Upload unsigned build for signing
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned
        uses: actions/upload-artifact@v5
        with:
          name: unsigned
          path: dist/

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: kbdking
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Build the installers (MSI)
        shell: pwsh
        run: |
          ./tools/build-installer.ps1 -Arch x64 -Version "${{ steps.version.outputs.version }}"
          ./tools/build-installer.ps1 -Arch arm64 -Version "${{ steps.version.outputs.version }}"

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/kbdking/* -DestinationPath "kbdking-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path dist/kbdking-arm64/* -DestinationPath "kbdking-${{ steps.version.outputs.version }}-win-arm64.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "kbdking-${{ steps.version.outputs.version }}-win-x64.zip" "kbdking-${{ steps.version.outputs.version }}-win-arm64.zip" artifacts/kbdking-x64.msi artifacts/kbdking-arm64.msi --title "kbdking ${{ steps.version.outputs.version }}" --generate-notes
