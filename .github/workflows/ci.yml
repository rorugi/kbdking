name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Engine and tests (Linux, clang oracle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install clang-cl and lld-link (reference compiler for the PE writer)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"

      - name: Test
        run: dotnet test tests/Kbdking.Tests/Kbdking.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Validate and build the samples
        run: |
          for f in samples/*.kbdking; do
            name=$(basename "$f" .kbdking)
            dotnet run --project src/Kbdking.Cli -c Release -- validate "$f"
            dotnet run --project src/Kbdking.Cli -c Release -- build "$f" -o "out/$name"
          done

      - name: Upload sample DLLs (for manual testing on Windows)
        uses: actions/upload-artifact@v5
        with:
          name: sample-layout-dlls
          path: out/

  windows:
    name: Windows (tests, install-and-type test, CLI, installer stub)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        shell: pwsh
        run: |
          dotnet test tests/Kbdking.Tests/Kbdking.Tests.csproj -c Release --logger "trx;LogFileName=all.trx" --results-directory TestResults
          $failedRun = $LASTEXITCODE
          foreach ($r in ([xml](Get-Content TestResults/all.trx)).TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }) {
            $stack = (("$($r.Output.ErrorInfo.StackTrace)" -split "`n") | Select-Object -First 4) -join "`n"
            $msg = "$($r.Output.ErrorInfo.Message)`n$stack" -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Output "::error title=$($r.testName)::$msg"
          }
          exit $failedRun

      # Installs a generated layout on the runner, types with it through ToUnicodeEx and uninstalls it.
      - name: Install-and-type test
        env:
          KBDKING_INSTALL_TESTS: "1"
        shell: pwsh
        run: |
          dotnet test tests/Kbdking.Tests/Kbdking.Tests.csproj -c Release --no-build `
            --filter "FullyQualifiedName~WindowsInstallTests" --logger "trx;LogFileName=install.trx" --results-directory TestResults
          $failedRun = $LASTEXITCODE
          foreach ($r in ([xml](Get-Content TestResults/install.trx)).TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }) {
            $stack = (("$($r.Output.ErrorInfo.StackTrace)" -split "`n") | Select-Object -First 4) -join "`n"
            $msg = "$($r.Output.ErrorInfo.Message)`n$stack" -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Output "::error title=$($r.testName)::$msg"
          }
          $counters = ([xml](Get-Content TestResults/install.trx)).TestRun.ResultSummary.Counters
          Write-Output "::notice title=Install-and-type test::passed=$($counters.passed) failed=$($counters.failed) skipped=$($counters.notExecuted)"
          # The test must actually run here; a skip would hide a broken setup.
          if ($failedRun -ne 0 -or [int]$counters.passed -lt 6) { exit 1 }

      - name: Publish CLI
        run: dotnet publish src/Kbdking.Cli/Kbdking.Cli.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o artifacts/cli

      - name: Publish installer stub (NativeAOT)
        run: dotnet publish src/Kbdking.Stub/Kbdking.Stub.csproj -c Release -r win-x64 -o artifacts/stub

      - name: Create the sample's standalone installer
        run: artifacts/cli/kbdking.exe package samples/german-austria-iast.kbdking -o artifacts/german-austria-iast-setup.exe --stub artifacts/stub/Kbdking.Stub.exe

      - name: Create the sample's MSI and Intune package
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          artifacts/cli/kbdking.exe package samples/german-austria-iast.kbdking --msi artifacts/german-austria-iast.msi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          artifacts/cli/kbdking.exe package samples/german-austria-iast.kbdking --intune artifacts/intune --stub artifacts/stub/Kbdking.Stub.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Installs the MSI quietly, checks the registration and removes it again.
      - name: MSI install test
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -ArgumentList '/i', "$PWD\artifacts\german-austria-iast.msi", '/qn', '/l*v', 'msi-install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 40; exit 1 }
          if (-not (Test-Path "$env:SystemRoot\System32\kbdiast.dll")) { Write-Output 'DLL missing'; exit 1 }
          $match = Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Control\Keyboard Layouts' | Where-Object { (Get-ItemProperty $_.PSPath).'Layout File' -eq 'kbdiast.dll' }
          if (-not $match) { Write-Output 'Registry entry missing'; exit 1 }
          Write-Output "::notice title=MSI install test::Registered as $($match.PSChildName)"
          & powershell -ExecutionPolicy Bypass -File artifacts/intune/detect.ps1
          if ($LASTEXITCODE -ne 0) { Write-Output 'Intune detection script did not find the layout'; exit 1 }
          $p = Start-Process msiexec.exe -ArgumentList '/x', "$PWD\artifacts\german-austria-iast.msi", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if (Test-Path "$env:SystemRoot\System32\kbdiast.dll") { Write-Output 'DLL not removed'; exit 1 }

      - uses: actions/upload-artifact@v5
        with:
          name: windows-cli-and-installer
          path: |
            artifacts/cli/kbdking.exe
            artifacts/german-austria-iast-setup.exe
            artifacts/german-austria-iast.msi
            artifacts/intune/

  arm64:
    name: Windows on ARM64 (install-and-type test with the ARM64 DLL)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install-and-type test
        env:
          KBDKING_INSTALL_TESTS: "1"
        shell: pwsh
        run: |
          Write-Output "OS architecture: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture), process: $([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          dotnet test tests/Kbdking.Tests/Kbdking.Tests.csproj -c Release `
            --filter "FullyQualifiedName~WindowsInstallTests" --logger "trx;LogFileName=install.trx" --results-directory TestResults
          $failedRun = $LASTEXITCODE
          foreach ($r in ([xml](Get-Content TestResults/install.trx)).TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }) {
            $stack = (("$($r.Output.ErrorInfo.StackTrace)" -split "`n") | Select-Object -First 4) -join "`n"
            $msg = "$($r.Output.ErrorInfo.Message)`n$stack" -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Output "::error title=$($r.testName)::$msg"
          }
          $counters = ([xml](Get-Content TestResults/install.trx)).TestRun.ResultSummary.Counters
          Write-Output "::notice title=ARM64 install-and-type test::passed=$($counters.passed) failed=$($counters.failed) skipped=$($counters.notExecuted)"
          if ($failedRun -ne 0 -or [int]$counters.passed -lt 6) { exit 1 }

  app:
    name: App (WinUI 3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build (x64)
        run: dotnet build src/Kbdking.App/Kbdking.App.csproj -c Release -p:Platform=x64

      - name: Build (ARM64)
        run: dotnet build src/Kbdking.App/Kbdking.App.csproj -c Release -p:Platform=ARM64

      # Publishes the app the way users do and starts it: it must still be running after 20 seconds.
      - name: Publish and start the app
        shell: pwsh
        env:
          KBDKING_NO_DIALOGS: "1"
        run: |
          dotnet publish src/Kbdking.App/Kbdking.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained -o app-out
          dotnet publish src/Kbdking.Cli/Kbdking.Cli.csproj -c Release -r win-x64 --self-contained -o app-out
          Get-ChildItem app-out -Filter *.pri | ForEach-Object { Write-Output "resources: $($_.Name)" }
          $p = Start-Process -FilePath app-out/Kbdking.App.exe -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          $log = Join-Path $env:LOCALAPPDATA 'kbdking\crash.log'
          if ($p.HasExited -or (Test-Path $log)) {
            $details = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
            $events = Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime','Application Error' } | Select-Object -First 2 | ForEach-Object { $_.Message }
            $pri = (Get-ChildItem app-out -Filter *.pri | ForEach-Object Name) -join ', '
            $text = ("exit code: $(if ($p.HasExited) { $p.ExitCode } else { 'running' }); resource files: $pri`n$details`n$($events -join "`n")") -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Output "::error title=App start::$text"
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            exit 1
          }
          Write-Output "::notice title=App start::The app was still running after 20 seconds."
          Stop-Process -Id $p.Id -Force

      # Pictures of the main pages with the sample layout open, published with the "screenshots"
      # pre-release, so changes to the user interface can be checked without a Windows PC.
      - name: Take screenshots
        continue-on-error: true
        shell: pwsh
        env:
          KBDKING_NO_DIALOGS: "1"
          KBDKING_DEMO: "1"
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Win
          {
              [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr window, out RECT rect);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr window);
              [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr window, IntPtr dc, uint flags);
              [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
          }
          '@
          [Win]::SetProcessDPIAware() | Out-Null
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $sample = (Resolve-Path samples/german-austria-iast.kbdking).Path
          $shots = @(
            @('layouts', 'layouts', ''), @('keys', 'tab-keys', ''), @('keys-altgr', 'tab-keys', 'altgr'),
            @('deadkeys', 'tab-deadkeys', ''), @('compose', 'tab-compose', ''), @('assistant', 'tab-assistant', ''),
            @('analysis', 'tab-analysis', ''), @('tests', 'tab-tests', ''), @('layout', 'tab-layout', ''), @('about', 'about', '')
          )
          foreach ($shot in $shots) {
            $env:KBDKING_TAB = $shot[1]
            $env:KBDKING_SHIFT_STATE = $shot[2]
            $p = Start-Process -FilePath app-out/Kbdking.App.exe -ArgumentList "`"$sample`"" -PassThru
            Start-Sleep -Seconds 12
            $p.Refresh()
            if ($p.HasExited -or $p.MainWindowHandle -eq 0) { Write-Output "::warning title=Screenshot::$($shot[0]): no window"; continue }
            $window = $p.MainWindowHandle
            [Win]::SetForegroundWindow($window) | Out-Null
            Start-Sleep -Milliseconds 800
            $rect = New-Object Win+RECT
            [Win]::GetWindowRect($window, [ref]$rect) | Out-Null
            $bmp = New-Object System.Drawing.Bitmap ($rect.Right - $rect.Left), ($rect.Bottom - $rect.Top)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $dc = $g.GetHdc()
            $ok = [Win]::PrintWindow($window, $dc, 2)  # PW_RENDERFULLCONTENT: also WinUI's composed content
            $g.ReleaseHdc($dc)
            if (-not $ok) { $g.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bmp.Size) }
            $bmp.Save("screenshots/$($shot[0]).png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 1
          }
          $log = Join-Path $env:LOCALAPPDATA 'kbdking\crash.log'
          if (Test-Path $log) { Write-Output "::warning title=Screenshots::$((Get-Content $log -Raw) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')" }
          Write-Output "::notice title=Screenshots::$((Get-ChildItem screenshots -Filter *.png).Count) pictures"

      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: screenshots
          path: screenshots/*.png

  installer:
    name: Windows installer (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags, for the version number

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Builds between releases are numbered after the last release: 0.1.0.42 = build 42 after v0.1.0.
      # (The MSI allows downgrades, so a release always installs over a newer build and the other way round.)
      - name: Version
        id: version
        shell: pwsh
        run: |
          $tag = git describe --tags --abbrev=0 --match 'v[0-9]*' 2>$null
          $base = if ($tag) { $tag.TrimStart('v') } else { '0.0.0' }
          "version=$base.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Build the MSI
        shell: pwsh
        run: ./tools/build-installer.ps1 -Arch ${{ matrix.arch }} -Version "${{ steps.version.outputs.version }}"

      # Installs the MSI like a user would, checks that the app starts from Program Files and the CLI is
      # there, then uninstalls it again. ARM64 can only be built here, not run.
      - name: Install, start and uninstall
        if: matrix.arch == 'x64'
        shell: pwsh
        env:
          KBDKING_NO_DIALOGS: "1"
        run: |
          $msi = (Resolve-Path artifacts/kbdking-x64.msi).Path
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; exit 1 }
          $dir = Join-Path $env:ProgramFiles 'kbdking'
          foreach ($f in 'Kbdking.App.exe', 'kbdking.exe', 'Kbdking.App.pri') {
            if (-not (Test-Path (Join-Path $dir $f))) { Write-Output "::error title=Installer::$f is missing in $dir"; exit 1 }
          }
          # The installed (trimmed) CLI does the real work for the app: build, validate, install and uninstall.
          $cli = Join-Path $dir 'kbdking.exe'
          & $cli templates
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $sample = (Resolve-Path samples/german-austria-iast.kbdking).Path
          Copy-Item $sample cli-test.kbdking
          (Get-Content cli-test.kbdking -Raw) -replace '"dllName": "kbdiast"', '"dllName": "kbdkscli"' | Set-Content cli-test.kbdking -Encoding utf8
          foreach ($cmd in @(@('validate', 'cli-test.kbdking'), @('test', 'cli-test.kbdking'), @('build', 'cli-test.kbdking', '-o', 'cli-build'))) {
            & $cli @cmd
            if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Installed CLI::kbdking $($cmd -join ' ') failed"; exit 1 }
          }
          $out = & $cli install cli-test.kbdking 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch ' as ([0-9A-Fa-f]{8})') { Write-Output "::error title=Installed CLI::install failed: $($out -replace "`r",'' -replace "`n",'%0A')"; exit 1 }
          $klid = $Matches[1]
          & $cli uninstall $klid --yes
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Installed CLI::uninstall $klid failed"; exit 1 }
          Write-Output "::notice title=Installed CLI::validate, test, build, install and uninstall work ($klid)"
          $app = Start-Process -FilePath (Join-Path $dir 'Kbdking.App.exe') -PassThru
          Start-Sleep -Seconds 20
          $app.Refresh()
          if ($app.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA 'kbdking\crash.log'
            $details = if (Test-Path $log) { (Get-Content $log -Raw) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A' } else { '' }
            Write-Output "::error title=Installed app::exited with $($app.ExitCode)%0A$details"
            exit 1
          }
          if ($app.MainWindowHandle -eq 0) { Write-Output '::error title=Installed app::is running but shows no window'; Stop-Process -Id $app.Id -Force; exit 1 }
          Write-Output "::notice title=Installed app::window '$($app.MainWindowTitle)' is open"
          Stop-Process -Id $app.Id -Force
          $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path (Join-Path $dir 'Kbdking.App.exe'))) { Write-Output '::error title=Installer::uninstall failed'; exit 1 }
          Write-Output "::notice title=Installer::Installed, started and uninstalled kbdking ${{ steps.version.outputs.version }}."

      # Installing an older version over a newer one must leave a complete app (all files replaced).
      - name: Install an older version over this one
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $new = (Resolve-Path artifacts/kbdking-x64.msi).Path
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$new`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Output "::error title=Downgrade::installing the new version failed ($($p.ExitCode))"; exit 1 }
          ./tools/build-installer.ps1 -Arch x64 -Version 0.0.1 -Output older
          $old = (Resolve-Path older/kbdking-x64.msi).Path
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$old`"", '/qn', '/l*v', 'downgrade.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content downgrade.log -Tail 40; Write-Output "::error title=Downgrade::installing 0.0.1 over the new version failed ($($p.ExitCode))"; exit 1 }
          $dir = Join-Path $env:ProgramFiles 'kbdking'
          $missing = @('Kbdking.App.exe', 'kbdking.exe', 'Kbdking.App.pri', 'Kbdking.Core.dll') | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          $version = (Get-Item (Join-Path $dir 'Kbdking.App.exe') -ErrorAction SilentlyContinue).VersionInfo.FileVersion
          Start-Process msiexec.exe -ArgumentList '/x', "`"$old`"", '/qn' -Wait | Out-Null
          if ($missing) { Write-Output "::error title=Downgrade::missing after installing an older version: $($missing -join ', ')"; exit 1 }
          Write-Output "::notice title=Downgrade::0.0.1 installed over ${{ steps.version.outputs.version }} completely (app file version $version)"

      - uses: actions/upload-artifact@v5
        with:
          name: kbdking-installer-${{ matrix.arch }}
          path: artifacts/kbdking-${{ matrix.arch }}.msi

  # Every push to main updates the "latest" pre-release, so the newest installer is always at
  # https://github.com/rorugi/kbdking/releases/tag/latest
  latest:
    name: Publish latest installers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, windows, arm64, app, installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: latest-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: kbdking-installer-*
          merge-multiple: true
          path: dist

      - name: Update the "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.msi --prerelease --target "${{ github.sha }}" \
            --title "Latest build (${{ needs.installer.outputs.version }})" \
            --notes "Automatic build of the newest commit on main (${GITHUB_SHA::7}). Not signed yet: Windows may warn that it doesn't know the publisher; choose More info → Run anyway. Download kbdking-x64.msi (or kbdking-arm64.msi for Windows on ARM) and run it."

      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: screenshots
          path: screenshots

      - name: Update the "screenshots" pre-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls screenshots/*.png >/dev/null 2>&1 || exit 0
          gh release delete screenshots --yes --cleanup-tag || true
          gh release create screenshots screenshots/*.png --prerelease --target "${{ github.sha }}" \
            --title "Screenshots of build ${{ needs.installer.outputs.version }}" \
            --notes "Pictures of the app taken automatically by the build (${GITHUB_SHA::7}), for checking the user interface. Not a download."
